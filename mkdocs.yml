site_name: earthaccess
site_description: Client library for NASA Earthdata APIs
site_url: https://github.com/nsidc/earthaccess

# Fail on broken links
strict: false

theme:
  name: "material"
  logo: earth.png
  favicon: earth.png
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  features:
    # Allow navigation sections to link to index/overview pages.
    # See: https://squidfunk.github.io/mkdocs-material/setup/setting-up-navigation/#section-index-pages
    - navigation.indexes

repo_name: nsidc/earthaccess
repo_url: https://github.com/nsidc/earthaccess
edit_uri: ""

extra_css:
  - css/styles.css

plugins:
  - search
  - mermaid2
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            docstring_options:
              ignore_init_summary: no
            merge_init_into_class: yes
            show_submodules: no
            show_root_heading: false
            show_source: false
  - autorefs
  - redirects:
      redirect_maps:
        "CODE_OF_CONDUCT.md": "contributor/code-of-conduct.md"
  - mkdocs-jupyter:
      execute: true
      execute_ignore:
        - "user/tutorials/SSL.ipynb"
        - "user/tutorials/dmrpp-virtualizarr.ipynb"
        - "user/tutorials/dask.ipynb"
        - "tutorials/virtual_data.ipynb"
        - "tutorials/icechunk_virtual.ipynb"
        - "tutorials/virtualize_combine_tree.ipynb"
        - "tutorials/odc-stac-cmr.ipynb"
        - "user/howto/edl.ipynb"
        - "user/explanation/fsspec.ipynb"
      ignore:
        - "tutorials/dask.ipynb"
        - "**/.ipynb_checkpoints/*"
        - "user_guide/fsspec.ipynb"
        - "tutorials/SSL.ipynb"
        - "tutorials/dmrpp-virtualizarr.ipynb"
        - "howto/edl.ipynb"

nav:
  - "What is earthaccess?": "index.md"
  - "Quick start": "user/quick-start.md"
  - "Work with us":
      - "Contributor guide": "contributor/index.md"
      - "Development Guide": "contributor/howto/development.md"
      - "Releasing Guide": "contributor/howto/releasing.md"
      - "Maintainers Guide": "contributor/howto/maintainers-guide.md"
      - "Triaging Guide": "contributor/howto/triaging.md"
      - "Pull Request Guide": "contributor/howto/pr-guide.md"
      - "Code of Conduct": "contributor/code-of-conduct.md"
      - "Contributing naming convention": "contributor/reference/naming-convention.md"
      - "Integration tests": "contributor/explanation/integration-tests.md"
      - Implementation Plans:
          - "Icechunk Virtual Cloud Cubes": "implementation-plan-icechunk-vcc.md"
          - "Virtualizing and Combining Granule Trees": "implementation-plan-virtualize-combine-tree.md"
      - Architecture & Design:
          - "Migration Guide: v0.x → v1.0.0": "migration-guide.md"
          - "Refactoring Overview": "refactoring.md"
          - "STAC Module Architecture": "refactoring/stac-module-architecture.md"
          - "Implementation Phases (Historical)": "refactoring/stac-implementation-log.md"
          - "Architecture Comparison": "refactoring/stac-comparison.md"
          - "Next-Gen Vision": "refactoring/earthaccess-nextgen.md"
  - "Resources": "resources.md"
  - USER GUIDE:
      - "user/index.md"
      - "Authentication": "user/explanation/authenticate.md"
      - "Status": "user/explanation/status.md"
      - "Search": "user/explanation/search.md"
      - "Access": "user/explanation/access.md"
      - "Backwards Compatibility": "user/explanation/backwards-compatibility.md"
  - HOW-TO:
      - "Authenticate with Earthdata Login": "user/howto/authenticate.md"
      - "Search for data using filters": "user/howto/search-granules.md"
      - "Access data": "user/howto/access-data.md"
      - "Direct S3 access - Open/stream files in the cloud": "user/howto/cloud.md"
      - "Using authenticated sessions to access data": "user/howto/edl.ipynb"
      - "Remote access and caching with earthaccess": "user/explanation/fsspec.ipynb"
      - "Search for services": "user/howto/search-services.md"
  - TUTORIALS:
      - "Accessing remote NASA data with fsspec": "user/tutorials/file-access.ipynb"
      - "Search and access of restricted datasets": "user/tutorials/restricted-datasets.ipynb"
      - "Accessing and visualizing EMIT data with a few lines of code": "user/tutorials/emit-earthaccess.ipynb"
      - "Cloud optimized access to TEMPO air quality data with earthaccess and virtualizarr": "user/tutorials/virtual_dataset_tutorial_with_TEMPO_Level3.ipynb"
      - Virtual Datasets:
          - "Virtual data with Icechunk": "tutorials/icechunk_virtual.ipynb"
          - "Combining granules into a tree": "tutorials/virtualize_combine_tree.ipynb"
          - "Opening STAC-cataloged cloud data": "tutorials/odc-stac-cmr.ipynb"
  - API REFERENCE:
      - "Search and Access": "api/index.md"
      - Collections:
          - "Collection Queries": "api/collections/collections-query.md"
          - "Collection Results": "api/collections/collections.md"
          - "Collection Services": "api/collections/collections-services.md"
      - Granules:
          - "Granule Queries": "api/granules/granules-query.md"
          - "Granule Results": "api/granules/granules.md"
      - STAC:
          - "Overview": "api/stac/overview.md"
          - "Conversion Functions": "api/stac/converters.md"
          - "Query Builders": "api/stac/queries.md"
          - "Result Methods": "api/stac/methods.md"
      - Store:
          - "Store": "api/store/store.md"
      - Auth:
          - "Auth": "api/auth/auth.md"
      - Glossary:
          - "NASA Glossary": "user/reference/glossary/nasa-glossary.md"
          - "Cloud Computing Terminology": "user/reference/glossary/cloud-glossary.md"
  - "About Us": "about-us.md"

markdown_extensions:
  - admonition
  - callouts
  - pymdownx.details
  - meta
  - md_in_html
  - toc:
      toc_depth: 2
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

  - pymdownx.tabbed:
      alternate_style: true

watch:
  - docs
  - earthaccess
