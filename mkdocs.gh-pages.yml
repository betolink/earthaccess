INHERIT: mkdocs.yml
site_url: https://betolink.github.io/earthaccess/
plugins:
  - search
  - mermaid2
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            docstring_options:
              ignore_init_summary: no
            merge_init_into_class: yes
            show_submodules: no
            show_root_heading: false
            show_source: false
  - autorefs
  - redirects:
      redirect_maps:
        "CODE_OF_CONDUCT.md": "contributor/code-of-conduct.md"
  - mkdocs-jupyter:
      execute: false
