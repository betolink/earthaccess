name: Deploy docs to GitHub Pages

on:
  push:
    branches: [nextgen-virtual]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d9f8 # v6
        with:
          enable-cache: true

      - name: Install docs dependencies
        run: uv sync --group docs

      - name: Build docs (no notebook execution)
        run: uv run mkdocs build -f mkdocs.gh-pages.yml

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202633dff825484f7df1ec7be15d2 # v3.0.1
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db00464c5f1f41a2c9056f8f9a5b9b3c8d2f7e # v4.0.5
